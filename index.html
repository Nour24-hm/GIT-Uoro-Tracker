<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIT 1 • Study Tracker</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--text:#17324d;--muted:#6f8192;--line:#dce6ef;--accent:#2f6f9f;--accent2:#72a8c9}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
.wrap{max-width:1050px;margin:auto;padding:24px 14px 50px}
header{background:linear-gradient(135deg,#244f73,#4f89b1);color:white;border-radius:22px;padding:25px 22px;box-shadow:0 8px 25px #17324d22}
h1{margin:0 0 6px;font-size:29px} .sub{opacity:.9}
.summary{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin-top:20px}
.circle{width:120px;height:120px;border-radius:50%;background:#ffffff22;border:7px solid #fff8;display:grid;place-items:center;font-size:28px;font-weight:800}
.bar{height:13px;background:#ffffff35;border-radius:99px;overflow:hidden}.fill{height:100%;background:white;width:0%;transition:.25s}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.pill{background:#fff2;color:white;padding:7px 10px;border-radius:99px;font-size:13px}
.section{background:var(--card);margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #17324d0b}
.section h2{margin:0;padding:17px 18px;background:#edf4f9;font-size:19px}.chapter{padding:0 18px 12px}.chapter h3{font-size:16px;margin:18px 0 9px;color:#315f80}
.item{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#fff}
.topic{font-weight:650;margin-bottom:9px;line-height:1.35}
.checks{display:flex;gap:14px;flex-wrap:wrap}.checks label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
input{accent-color:var(--accent);width:17px;height:17px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 14px;background:#244f73;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e8eef4;color:#31536c}
.note{width:100%;min-height:100px;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit;resize:vertical}
.small{color:var(--muted);font-size:12px}
@media(max-width:650px){.summary{grid-template-columns:1fr;text-align:center}.circle{margin:auto}.bar{text-align:left}.stats{justify-content:center}.item{padding:11px}.checks{gap:9px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>📚 GIT 1 • Study Tracker</h1>
<div class="sub">Track your studying, revision & questions — automatically saved on this device.</div>
<div class="summary">
<div class="circle" id="percent">0%</div>
<div><div class="bar"><div class="fill" id="fill"></div></div>
<div class="stats"><span class="pill" id="done">0 / 0</span><span class="pill" id="studied">Studied: 0</span><span class="pill" id="revised">Revised: 0</span><span class="pill" id="questions">Questions: 0</span></div></div>
</div>
</header>

<div id="content"></div>

<div class="section" style="padding:18px">
<h2 style="background:none;padding:0 0 10px">📝 Notes</h2>
<textarea id="notes" class="note" placeholder="Write anything you want to remember..."></textarea>
<div class="small" style="margin-top:7px">Your checkmarks and notes are saved automatically in this browser.</div>
<footer><span class="small">GIT 1 • You’ve got this 💪</span><button class="secondary" onclick="resetAll()">Reset tracker</button></footer>
</div>
</div>

<script>
const data = [
["Unit I – Nutrition Overview (N)","",[
"Biochemistry: Macronutrients (dietary carbohydrates, proteins & fats)",
"Lipogenesis and obesity",
"Micronutrients (vitamins & minerals)"
]],
["Unit II – Upper GIT (U)","Chapter 1 – Oral cavity, salivary glands & oesophagus",[
"Anatomy: Anatomical structure of oral cavity, salivary glands and esophagus",
"Anatomy: Embryological development of oral cavity, pharynx and salivary glands",
"Histology: Histological structure of oral cavity, pharyngeal & esophageal wall and salivary glands",
"Physiology: General functions and control mechanisms of digestive system",
"Physiology: Chewing, salivary secretion & control mechanisms",
"Physiology: Swallowing, esophageal motility & disorders",
"Microbiology: General microbial infections of GIT",
"Microbiology: Microbial infections of salivary glands & esophagus",
"Pathology: Pathological features of oral cavity, salivary glands & esophageal diseases"
]],
["Unit II – Upper GIT (U)","Chapter 2 – Stomach",[
"Anatomy (+ duodenum): Anatomical structure of anterior abdominal wall",
"Anatomy (+ duodenum): Anatomical structure of abdominal viscera",
"Anatomy (+ duodenum): Embryological development of foregut",
"Histology: Histological structure of gastric wall",
"Physiology: Mechanisms of gastric motility and vomiting",
"Physiology: Regulatory mechanisms & functions of gastric secretion",
"Microbiology: Microbial gastritis",
"Pathology: Pathological features of gastric diseases",
"Pharmacology: Drug therapy of vomiting",
"Pharmacology: Drug therapy of acid-related GIT diseases"
]]
];
const key="git1TrackerV1";
let state=JSON.parse(localStorage.getItem(key)||'{}');
const content=document.getElementById("content");
let n=0;
data.forEach((u,ui)=>{
 let sec=document.createElement("div");sec.className="section";
 sec.innerHTML=`<h2>${u[0]}</h2><div class="chapter"><h3>${u[1]}</h3></div>`;
 let ch=sec.querySelector(".chapter");
 u[2].forEach((topic)=>{
   const id=n++;
   const item=document.createElement("div");item.className="item";
   item.innerHTML=`<div class="topic">${topic}</div><div class="checks">
   <label><input type="checkbox" data-id="${id}" data-type="s"> Studied</label>
   <label><input type="checkbox" data-id="${id}" data-type="r"> Revised</label>
   <label><input type="checkbox" data-id="${id}" data-type="q"> Questions</label>
   </div>`;
   ch.appendChild(item);
 });
 content.appendChild(sec);
});
document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
 const k=cb.dataset.id+"_"+cb.dataset.type; cb.checked=!!state[k];
 cb.addEventListener("change",()=>{state[k]=cb.checked;save();update()});
});
const notes=document.getElementById("notes"); notes.value=state.notes||"";
notes.addEventListener("input",()=>{state.notes=notes.value;save()});
function save(){localStorage.setItem(key,JSON.stringify(state))}
function update(){
 const boxes=[...document.querySelectorAll("input[type=checkbox]")], done=boxes.filter(x=>x.checked).length;
 const total=boxes.length, pct=total?Math.round(done/total*100):0;
 document.getElementById("percent").textContent=pct+"%";document.getElementById("fill").style.width=pct+"%";
 document.getElementById("done").textContent=`${done} / ${total} completed`;
 for(const [type,id] of [["s","studied"],["r","revised"],["q","questions"]])
   document.getElementById(id).textContent=(type==="s"?"Studied: ":type==="r"?"Revised: ":"Questions: ")+boxes.filter(x=>x.dataset.type===type&&x.checked).length;
}
function resetAll(){if(confirm("Reset all checkmarks and notes?")){state={};save();location.reload()}}
update();
</script>
</body>
</html>
